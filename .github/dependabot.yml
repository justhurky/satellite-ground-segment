version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
      test-libraries:
        patterns:
          - "org.testcontainers:*"
          - "org.junit*"
          - "org.assertj:*"
          - "org.mockito:*"
          - "com.tngtech.archunit:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
