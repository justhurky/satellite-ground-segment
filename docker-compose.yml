services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: groundsegment
      POSTGRES_USER: ground_segment
      POSTGRES_PASSWORD: ground_segment
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ground_segment -d groundsegment"]
      interval: 5s
      timeout: 3s
      retries: 10

  ground-segment:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,demo
      GROUND_SEGMENT_DB_URL: jdbc:postgresql://database:5432/groundsegment
      GROUND_SEGMENT_DB_USER: ground_segment
      GROUND_SEGMENT_DB_PASSWORD: ground_segment
      GROUND_SEGMENT_JWT_SECRET: compose-profile-signing-key-not-for-production
      GROUND_SEGMENT_DATA_ENCRYPTION_KEY: 5wwTGlnv/8J0FwEGgViotGHCMy1/uLscwsQQcT5CmEA=
    ports:
      - "8080:8080"

volumes:
  database:
