spring:
  datasource:
    url: ${GROUND_SEGMENT_DB_URL:jdbc:postgresql://localhost:5432/groundsegment}
    username: ${GROUND_SEGMENT_DB_USER:ground_segment}
    password: ${GROUND_SEGMENT_DB_PASSWORD:ground_segment}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 5000
