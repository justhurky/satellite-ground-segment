spring:
  datasource:
    url: jdbc:h2:mem:groundsegment-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
  jpa:
    show-sql: false

ground-segment:
  jwt:
    secret: integration-test-signing-key-0123456789abcdef
    access-token-ttl: PT15M
  crypto:
    data-encryption-key: 5wwTGlnv/8J0FwEGgViotGHCMy1/uLscwsQQcT5CmEA=
  uplink:
    dispatch-interval: 1h

logging:
  level:
    org.hibernate.tool.schema: WARN
